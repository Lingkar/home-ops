---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 127.0.0.1
  - 192.168.69.5
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: "true"
  default-watch-cache-size: "5"
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 256Mi
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 128Mi
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Seed the control-plane taint and the external-LB exclusion label here so that the
# corresponding $patch: delete in 05-node-config.yaml always resolves. On nodes still
# running Talos < 1.14 the generated base has no KubeNodeConfig taints/labels, and a
# strict $patch: delete of a missing key aborts config generation. On Talos >= 1.14
# the base already carries these values, so the seed is a no-op. Both are removed
# again in 05-node-config.yaml.
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane: NoSchedule
labels:
  node.kubernetes.io/exclude-from-external-load-balancers: ""
