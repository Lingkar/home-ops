expose:
  tls:
    enabled: false
  type: route
  route:
    hosts:
      - harbor.buijnsters.com
    parentRefs:
      - name: internal
        namespace: network
externalURL: https://harbor.buijnsters.com
database:
  type: external
  external:
    host: cnpg-harbor-rw
    username: app
    # nosemgrep: generic.secrets.gitleaks.generic-api-key.generic-api-key
    existingSecret: cnpg-harbor-app
    coreDatabase: app
core:
  resources:
    requests:
      cpu: 20m
      memory: 152Mi
    limits:
      memory: 152Mi
  nodeSelector:
    kubernetes.io/arch: amd64
jobservice:
  resources:
    requests:
      cpu: 32m
      memory: 48Mi
    limits:
      memory: 48Mi
  nodeSelector:
    kubernetes.io/arch: amd64
portal:
  resources:
    requests:
      cpu: 10m
      memory: 40Mi
    limits:
      memory: 40Mi
  nodeSelector:
    kubernetes.io/arch: amd64
registry:
  registry:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
  controller:
    resources:
      requests:
        cpu: 10m
        memory: 40Mi
      limits:
        memory: 40Mi
  nodeSelector:
    kubernetes.io/arch: amd64
redis:
  internal:
    resources:
      requests:
        cpu: 10m
        memory: 40Mi
      limits:
        memory: 40Mi
    nodeSelector:
      kubernetes.io/arch: amd64
trivy:
  resources:
    requests:
      cpu: 10m
      memory: 160Mi
    limits:
      cpu: null
      memory: 160Mi
  nodeSelector:
    kubernetes.io/arch: amd64
persistence:
  persistentVolumeClaim:
    registry:
      size: 10Gi
