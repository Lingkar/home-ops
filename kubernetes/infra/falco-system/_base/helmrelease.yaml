# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: falco
  valuesFrom:
    - kind: ConfigMap
      name: falco-values
    - kind: ConfigMap
      name: falco-values
      valuesKey: env-values.yaml
