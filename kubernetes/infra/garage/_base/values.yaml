image:
  repository: dxflrs/garage
garage:
  replicationFactor: "1"
  metadataAutoSnapshotInterval: "4 hours"
priorityClassName: platform-low
deployment:
  replicaCount: 1
persistence:
  meta:
    storageClass: ssd-lvm-thin-2
    size: 4Gi
  data:
    storageClass: ssd-lvm-thin-2
    size: 40Gi
monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  tracing:
    # TODO: add otel endpoint for tracing
    sink: ""
