grafana:
  enabled: false
  forceDeployDatasources: true
  forceDeployDashboards: true
  operator:
    dashboardsConfigMapRefEnabled: true
    matchLabels:
      dashboards: grafana
    folder: kube-prometheus-stack
  defaultRules:
    rules:
      kubeProxy: false
  defaultDashboardsTimezone: Europe/Amsterdam
  defaultDashboardsEditable: false
kubeProxy:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 14d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    enableFeatures:
      - exemplar-storage
    resources:
      requests:
        cpu: 150m
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          storageClassName: ssd-lvm-thin-2
          resources:
            requests:
              storage: 30Gi
nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false
kube-state-metrics:
  resources:
    requests:
      cpu: 40m
      memory: 192Mi
    limits:
      memory: 192Mi
prometheusOperator:
  resources:
    requests:
      cpu: 35m
      memory: 100Mi
    limits:
      memory: 100Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 32Mi
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-ntfy
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      # Drop everything by default; only alerts matching a child route below notify.
      receiver: "null"
      group_by:
        - namespace
        - alertname
        - name
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Notify on all severities by default. To raise the threshold, narrow the
        # regex below (e.g. "warning|critical", or "critical").
        - matchers:
            - severity =~ "info|warning|critical"
          receiver: ntfy
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url: http://ntfy.ntfy.svc.cluster.local/home-alerts
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/NTFY_TOKEN
    inhibit_rules:
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ "warning|info"
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
      - equal:
          - namespace
        source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
      - target_matchers:
          - alertname = InfoInhibitor
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
    limits:
      memory: 32Mi
