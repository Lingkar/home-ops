deploymentMode: Monolithic
defaults:
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: s3-credentials
loki:
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
    s3:
      endpoint: http://garage-headless.garage.svc.cluster.local:3900
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      accessKeyId: ${S3_ACCESS_KEY_ID}
      insecure: true
      s3ForcePathStyle: true
  limits_config:
    retention_period: 90d
    max_query_length: 14d
  schemaConfig:
    configs:
      - from: 2024-04-01
        object_store: s3
        store: tsdb
        schema: v13
        index:
          prefix: index_
          period: 24h
  ingester:
    chunk_encoding: snappy
    chunk_idle_period: 1h
    wal:
      replay_memory_ceiling: 2GB
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100mi
      memory: 4Gi
    limits:
      memory: 4Gi
  persistence:
    storageClass: ssd-lvm-thin-2

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
