# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/monitoring.coreos.com/prometheus_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus-otel
spec:
  alerting:
    alertmanagers:
      - apiVersion: v2
        name: kube-prometheus-stack-alertmanager
        pathPrefix: /
        port: http-web
  automountServiceAccountToken: false
  enableAdminAPI: false
  enableFeatures:
    - exemplar-storage
  enableOTLPReceiver: true
  evaluationInterval: 30s
  externalUrl: http://prometheus.monitoring:9090
  hostNetwork: false
  image: quay.io/prometheus/prometheus:v3.13.1-distroless
  imagePullPolicy: IfNotPresent
  listenLocal: false
  logFormat: logfmt
  logLevel: info
  paused: false
  podMonitorNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - nonexistent
  podMonitorSelector: {}
  portName: http-web
  probeNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - nonexistent
  probeSelector: {}
  replicas: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 150m
  retention: 14d
  routePrefix: /
  ruleNamespaceSelector: {}
  ruleSelector: {}
  scrapeConfigNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - nonexistent
  scrapeConfigSelector: {}
  scrapeInterval: 30s
  securityContext:
    fsGroup: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  serviceMonitorNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - nonexistent
  serviceMonitorSelector: {}
  serviceName: prometheus-otel
  shards: 1
  storage:
    volumeClaimTemplate:
      metadata:
        labels:
          velero.io/exclude-from-backup: "true"
      spec:
        resources:
          requests:
            storage: 30Gi
        storageClassName: ssd-lvm-thin-2
  tsdb:
    outOfOrderTimeWindow: 0s
  version: v3.13.1-distroless
  walCompression: true
