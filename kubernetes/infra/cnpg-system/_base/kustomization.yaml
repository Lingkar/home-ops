# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-dashboard.yaml
  - helmrelease.yaml
  - plugin-helmrelease.yaml
  - plugin-source.yaml
  - source.yaml
configMapGenerator:
  - name: values-cnpg
    behavior: create
    files:
      - values.yaml=values.yaml
    literals:
      - env-values.yaml=''
  - name: values-plugin-barman-cloud
    behavior: create
    files:
      - values.yaml=plugin-values.yaml
    literals:
      - env-values.yaml=''
configurations:
  - ../../utils/helm/kustomizeconfig.yaml
