# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
spec:
  interval: 1h
  dependsOn:
    - name: substrate-atelet
  chartRef:
    kind: OCIRepository
    name: substrate
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-substrate
    - kind: ConfigMap
      name: values-substrate
      valuesKey: env-values.yaml
