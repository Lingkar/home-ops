createNamespace: false
preview:
  - PerTemplateSnapshotLocation
  - GoldenEgressPolicy
postgres:
  clientCertificates:
    enabled: false
  readWriteConnectionStringSecretRef:
    name: substrate-postgres-readwrite
    key: readWriteConnectionString
  ownerConnectionStringSecretRef:
    name: substrate-postgres-owner
    key: ownerConnectionString
  readWriteRole: substrate_readwrite
  ownerRole: substrate_owner
  schema: substrate
atelet:
  enabled: false
  storageBackend: s3
ateApi:
  snapshotLocation: gs://ate-snapshots/
  actorJWTIssuer: https://idp.ate-system.svc
  authorization:
    bootstrapOwners:
      - spiffe://cluster.local/ns/kagent/sa/kagent-controller
      - system:serviceaccount:ate-system:ate-client
atenetRouter:
  ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/kagent/sa/kagent-controller
credentialProvider:
  namespacePolicies:
    - atespace: kagent
      allowedNamespaces:
        - kagent
objectStorePlugin:
  extraEnv:
    - name: AWS_REGION
      value: garage
    - name: AWS_ENDPOINT_URL
      value: http://garage-headless.garage.svc.cluster.local:3900
    - name: AWS_S3_USE_PATH_STYLE
      value: "true"
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: substrate-garage-credentials
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: substrate-garage-credentials
          key: AWS_SECRET_ACCESS_KEY
rustfs:
  enabled: false
