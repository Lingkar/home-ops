# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: substrate-crds
  install:
    atomic: false
    wait: true
    timeout: 5m
    remediation:
      retries: -1
  upgrade:
    atomic: false
    wait: true
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: values-substrate-crds
    - kind: ConfigMap
      name: values-substrate-crds
      valuesKey: env-values.yaml
