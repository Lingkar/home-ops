# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kagent-crds
  install:
    timeout: 5m
    remediation:
      retries: -1
  upgrade:
    timeout: 5m
    cleanupOnFail: true
    remediation:
      retries: 3
