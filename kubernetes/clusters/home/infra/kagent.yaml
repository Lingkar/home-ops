# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: substrate
      namespace: flux-system
    - name: kagent-database
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kagent-crds
      namespace: &namespace kagent
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kagent
      namespace: *namespace
  interval: 1h
  path: ./kagent/operator/_base
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: ExternalArtifact
    name: infra
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 15m
  wait: false
