# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app harbor-system
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cnpg-system
      namespace: flux-system
  interval: 1h
  path: ./harbor-system/_base
  components:
    - ../../components/common
    - ../../components/cnpg-backup
    - ../../components/cnpg-backup-schedule
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: infra
    namespace: flux-system
  targetNamespace: harbor-system
  timeout: 15m
  wait: true
