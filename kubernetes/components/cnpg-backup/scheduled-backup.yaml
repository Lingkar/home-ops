# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: weekly
spec:
  schedule: "0 30 2 * * 0" # Sundays at 02:30 (6-field cron)
  immediate: true
  backupOwnerReference: self
  cluster:
    name: placeholder # replaced with the namespace's Cluster name
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
