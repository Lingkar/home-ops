# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - scheduled-backup.yaml
replacements:
  - source:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      fieldPath: metadata.name
    targets:
      - select:
          group: postgresql.cnpg.io
          version: v1
          kind: ScheduledBackup
        fieldPaths:
          - spec.cluster.name
