# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.6.2/charts/library/common/values.schema.json
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  hostIPC: false
  hostNetwork: false
  hostPID: false
  shareProcessNamespace: false
  priorityClassName: platform-high
controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: docker.io/wordpress
          tag: 7.1.4@sha256:8b64037bb2a3bdc41bebccb165f20ad5e4c786b684ae4a2bd5981f98aa1eb107
        env:
          - name: WORDPRESS_DB_HOST
            value: mysql-0.mysql.svc.cluster.local
          - name: WORDPRESS_DB_NAME
            value: phela
          - name: WORDPRESS_DB_USER
            value: phela
          - name: WORDPRESS_DB_PASSWORD
            secretKeyRef:
              name: mysql-credentials
              key: PASSWORD
        resources:
          requests:
            cpu: 64m
            memory: 832Mi
          limits:
            memory: 832Mi
service:
  main:
    ports:
      http:
        port: 80
        protocol: TCP
route:
  main:
    parentRefs:
      - name: external
        namespace: network
    hostnames: ["phela-intelligence.com"]
persistence:
  wordpress-data:
    type: persistentVolumeClaim
    storageClass: ssd-lvm-thin-2
    accessMode: ReadWriteOnce
    size: 4Gi
    retain: true
    advancedMounts:
      main:
        main:
          - path: /var/www/html
            readOnly: false
