# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
spec:
  storageClassName: hdd-raidz-thin-1
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
