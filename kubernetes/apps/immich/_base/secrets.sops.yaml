# PLACEHOLDER SECRETS — DO NOT PUSH UNENCRYPTED.
# Fill in real values, then encrypt in place (path rule in .sops.yaml applies):
#   sops kubernetes/apps/immich/_base/secrets.sops.yaml
# JWT_SECRET: generate with `openssl rand -hex 32`.
# DB credentials are NOT stored here: they live in the CNPG-managed secret
# cnpg-immich-app, created by the Cluster in database.yaml.
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: immich-secrets
stringData:
  JWT_SECRET: PLACEHOLDER_replace_me_and_encrypt_with_sops
