apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
spec:
  hostnames: ["ntfy.${SECRET_DOMAIN}"]
  parentRefs:
    - name: external
      namespace: network
  rules:
    - backendRefs:
        - name: ntfy
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
spec:
  type: ClusterIP
  selector:
    app: ntfy
  ports:
    - name: http-ntfy-out
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  labels:
    app: ntfy
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
          args: ["serve"]
          env:
            - name: NTFY_BASE_URL
              value: "https://ntfy.${SECRET_DOMAIN}"
            - name: NTFY_UPSTREAM_BASE_URL
              value: "https://ntfy.sh"
            - name: NTFY_LOG_LEVEL
              value: INFO
            - name: NTFY_AUTH_DEFAULT_ACCESS
              value: deny-all
            - name: NTFY_AUTH_FILE
              value: "/var/lib/ntfy/user.db"
            - name: NTFY_CACHE_FILE
              value: "/var/lib/ntfy/cache.db"
            - name: NTFY_ATTACHMENT_CACHE_DIR
              value: "/var/lib/ntfy/attachments"
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - secretRef:
                name: ntfy-auth
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 60Mi
            limits:
              memory: 60Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
            - name: volume
              mountPath: /var/lib/ntfy
      volumes:
        - name: config
        - name: volume
          persistentVolumeClaim:
            claimName: ntfy
