# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-models
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  storageClassName: ssd-lvm-thin-1
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
