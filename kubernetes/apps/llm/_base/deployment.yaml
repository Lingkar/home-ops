# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  labels:
    app.kubernetes.io/name: llamacpp
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamacpp
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: c-02
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command:
            - /bin/sh
            - -ceu
            - |
              file=/models/Qwen3-32B-Q4_K_M.gguf
              sha=efd971561896866f0e910cce52761ca77b1b138090c7f15fe284676d57d1f689
              url=https://huggingface.co/Qwen/Qwen3-32B-GGUF/resolve/938a7432affaec9157f883a87164e2646ae17555/Qwen3-32B-Q4_K_M.gguf
              if [ -f "$file" ] && [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$sha" ]; then
                echo "model already present"
                exit 0
              fi
              echo "downloading $url"
              curl -fL --retry 5 --retry-delay 5 --retry-all-errors -C - -o "$file.part" "$url"
              echo "$sha  $file.part" | sha256sum -c -
              mv "$file.part" "$file"
              echo "model ready"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-10.0@sha256:5388eb3ba10a703815476cbe63c7d86d46e815427ec11d258464e1f08539da22
          command:
            - llama-server
          args:
            - -m
            - /models/Qwen3-32B-Q4_K_M.gguf
            - -c
            - "32768"
            - -ngl
            - "999"
            - -b
            - "2048"
            - -ub
            - "2048"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -fa
            - "1"
            - --cache-type-k
            - f16
            - --cache-type-v
            - f16
            - --jinja
            - --alias
            - qwen3-32b
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: API_KEY
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              generic-device/gpu-amd: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-models
