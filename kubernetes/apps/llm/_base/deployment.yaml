# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  labels:
    app.kubernetes.io/name: llamacpp
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamacpp
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: c-02
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command:
            - /bin/sh
            - -ceu
            - |
              base="https://huggingface.co"
              model_rev="38bb39ee97821de2c9009abb7e93950eec396e66"
              mtp_rev="896756c9558ea9d5bd621c5e9a2d618f78b364f5"
              out="/models"
              fetch() {
                path="$1"; sha="$2"; total="$3"; url="$4"
                ok="$path.ok"
                if [ -f "$path" ]; then
                  if [ -f "$ok" ]; then
                    echo "$path already present (checksummed previously)"
                    return 0
                  fi
                  echo "$path present, verifying once"
                  if [ "$(sha256sum "$path" | cut -d' ' -f1)" = "$sha" ]; then
                    : > "$ok"
                    echo "$path verified"
                    return 0
                  fi
                  echo "$path failed verification, re-downloading"
                  rm -f "$path"
                fi
                report() {
                  while :; do
                    size=$(stat -c %s "$path.part" 2>/dev/null || echo 0)
                    if [ "$size" -gt 0 ]; then
                      printf '%s  %s/%s MiB (%s%%)\n' \
                        "$(date -u +%H:%M:%S)" "$(( size / 1048576 ))" "$(( total / 1048576 ))" "$(( size * 100 / total ))"
                    fi
                    sleep 10
                  done
                }
                report &
                reporter=$!
                echo "downloading $url"
                rc=0
                curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                  --connect-timeout 15 --speed-limit 10240 --speed-time 60 \
                  -C - -o "$path.part" "$url" || rc=$?
                kill "$reporter" 2>/dev/null || true
                [ "$rc" -eq 0 ] || { echo "download failed (curl exit $rc)"; exit "$rc"; }
                echo "verifying sha256 $path"
                echo "$sha  $path.part" | sha256sum -c -
                mv "$path.part" "$path"
                : > "$ok"
              }
              model_base="$base/unsloth/Qwen3.8-Flash-Next-GGUF/resolve/$model_rev/UD-IQ3_XXS"
              fetch "$out/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00003.gguf" "268f81fdedf3149a538f252308927a4d5d1f6e062c178568a51e3b519744f8a8" 10946624 "$model_base/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00003.gguf"
              fetch "$out/Qwen3.8-Flash-Next-UD-IQ3_XXS-00002-of-00003.gguf" "cfe600b236b88c7fad1613a5ca5e83b9f2beb63cbd44c32b2be50a44747c695f" 49567921344 "$model_base/Qwen3.8-Flash-Next-UD-IQ3_XXS-00002-of-00003.gguf"
              fetch "$out/Qwen3.8-Flash-Next-UD-IQ3_XXS-00003-of-00003.gguf" "f1912ba34c79427d2295a58dcb2b732b5931af5bef7a373c60557a57d9ee7250" 32382955968 "$model_base/Qwen3.8-Flash-Next-UD-IQ3_XXS-00003-of-00003.gguf"
              fetch "$out/mtp-Qwen3.8-Flash-Next-hc-Q8_0.gguf" "9db03a687670608286e99b563fcc86d0ee76c8dd863f64b2afc0b54eb0eb975d" 4137429088 "$base/EasiiX/Qwen3.8-Flash-Next-MTP-Strix-Halo-GGUF/resolve/$mtp_rev/mtp-Qwen3.8-Flash-Next-hc-Q8_0.gguf"
              echo "all models ready"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-10.0-engramhalo@sha256:e17da4593e75cd85fe5cb955032fd092e19120930024d363b446c7452b3fceaf
          command:
            - llama-server
          args:
            - -m
            - /models/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00003.gguf
            - -md
            - /models/mtp-Qwen3.8-Flash-Next-hc-Q8_0.gguf
            - --spec-type
            - draft-mtp,ngram-mod
            - --spec-draft-n-max
            - "4"
            - --spec-draft-p-min
            - "0.75"
            - -c
            - "163840"
            - -ngl
            - "999"
            - -fa
            - "on"
            - -ctk
            - q8_0
            - -ctv
            - q8_0
            - -lm
            - mmap
            - --lazy-mode
            - "on"
            - -b
            - "8192"
            - -ub
            - "2048"
            - -t
            - "4"
            - --parallel
            - "1"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --jinja
            - --no-webui
            - --alias
            - qwen3.8-flash-next
          env:
            - name: ROCBLAS_USE_HIPBLASLT
              value: "1"
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: API_KEY
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 56Gi
            limits:
              generic-device/gpu-amd: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-model-qwen38-flash-next-iq3-xxs
