# Configuration for scripts/c02-shutdown.sh
#
# Review this file before running the script. The defaults keep the
# two-node critical set alive and stop the workloads that do not fit.
# See docs/c02-shutdown.md for the full procedure.

node:
  name: c-02
  ip: 192.168.68.254
  # These LINSTOR satellites must be Online before c-02 is drained.
  requireOnline:
    - c-01
    - rpi-00
  refuseControlPlane: true

keep:
  # Documentation / preflight only. These namespaces must not be scaled.
  namespaces:
    - kube-system
    - piraeus-datastore
    - cert-manager
    - network
    - netbird
    - mysql
    - mysql-system
    - harbor-system
    - home-assistant
    - phela
    - zigbee2mqtt
    - ntfy
    - garage
    - generic-device-plugin
    - spegel
    - podcertificate-controller-system

flux:
  # Suspended first; unsuspended in reverse order on restore.
  # The top-level Kustomization goes first so the roots cannot reset the
  # child suspend flags.
  suspendKustomizations:
    - flux-system/flux-system
    - flux-system/infra
    - flux-system/apps
    - flux-system/mysql
    - flux-system/harbor-system
    # Add out-of-repo Kustomizations/namespaces with --extra-config or
    # C02_EXTRA_CONFIG. Keep this public config free of private workload names.
    # The LINSTOR controllers stay; only the c-02 disk health CronJobs below
    # need their Kustomization paused so they are not un-suspended.
    - flux-system/disk-health
  # Discover and suspend all Kustomizations whose spec.targetNamespace is in
  # scale.namespaces, plus every HelmRelease in those namespaces.
  autoSuspendKustomizationsForNamespaces: true
  suspendHelmReleasesInNamespaces: true
  extraKustomizations: []
  extraHelmReleases:
    # Harbor is kept, but its HelmRelease is paused so the live amd64 pins
    # and its existing pods are not rolled while c-02 is draining.
    - harbor-system/harbor

scale:
  # Deployments and StatefulSets in these namespaces are scaled to 0.
  # Keep this list to public namespaces. Add out-of-repo namespaces with
  # --extra-config or C02_EXTRA_CONFIG.
  namespaces:
    # Flux is suspended first and then the controllers are scaled to 0.
    # This is what makes the pause durable: otherwise the flux-operator can
    # reset the top-level Kustomization's suspend flag and Flux resumes.
    - flux-system
    - ate-system
    - kagent
    - crossplane-system
    - rabbitmq-system
    - velero
    - falco
    - falco-system
    - grafana-system
    - opentelemetry-system
    - monitoring
    # cnpg-system is stopped after the Harbor DB has been moved to c-01.
    # The DB pods keep running; only the controller is paused.
    - cnpg-system
    - immich
    - keycloak-system
    - llm
    - portfolio
  # Optional namespace/kind/name exclusions if a workload in a scaled
  # namespace must remain.
  exclude: []
  # DaemonSets cannot be scaled; patch their nodeSelector to a sentinel no
  # node matches and delete their pods.
  daemonSets:
    - falco/falco
    - velero/node-agent
    - monitoring/opentelemetry-kube-stack-daemon-collector
    - monitoring/loki-canary
    - monitoring/kube-prometheus-stack-prometheus-node-exporter
    - ate-system/atelet
  # CronJobs to suspend while the node is down.
  cronJobs:
    - velero/kopia-verify-full
    - velero/kopia-verify-shallow
    - piraeus-datastore/disk-health-c-02
    - piraeus-datastore/smartctl-long-c-02
    - piraeus-datastore/smartctl-short-c-02

customResources:
  # Stop these before scaling namespaces. The script waits for the matching
  # pods to disappear, then scales the remaining workloads (including the
  # operators that processed the custom resources).
  - apiVersion: k8s.keycloak.org/v2beta1
    kind: Keycloak
    namespace: keycloak-system
    name: kc-infra
    restoreField: spec.instances
    stopPatch:
      spec:
        instances: 0
  - apiVersion: monitoring.coreos.com/v1
    kind: Prometheus
    namespace: monitoring
    name: kube-prometheus-stack-prometheus
    restoreField: spec.replicas
    stopPatch:
      spec:
        replicas: 0
  - apiVersion: monitoring.coreos.com/v1
    kind: Alertmanager
    namespace: monitoring
    name: kube-prometheus-stack-alertmanager
    restoreField: spec.replicas
    stopPatch:
      spec:
        replicas: 0

waitForPodsGone:
  - namespace: keycloak-system
    pod: kc-infra-.*
  - namespace: monitoring
    pod: prometheus-kube-prometheus-stack-prometheus-.*
  - namespace: monitoring
    pod: alertmanager-kube-prometheus-stack-alertmanager-.*

# Pods with a blocking PDB that belong to kept apps are moved off the node
# explicitly before kubectl drain. The pod is recreated by its controller on
# an amd64 node because c-02 is already cordoned.
# Only deleted when the pod currently runs on the target node.
preDrainDeletePods:
  - harbor-system/cnpg-harbor-1
  # Move MySQL before drain so its PDB cannot stall the drain. The pod is
  # recreated on c-01 (amd64) by the MySQL operator.
  - mysql/mysql-0-0

# No static workload patches here. GitOps owns the Harbor amd64
# nodeSelectors/CNPG affinity and the MySQL CR podSpec. The script verifies
# those in preflight and syncs the MySQL CR podSpec to the live StatefulSet/
# router, because the MySQL operator only reads podSpec at build time.

# Wait for the MySQL StatefulSet/router rollouts after the sync from the
# InnoDBCluster CR. The operator only reads podSpec when it builds the
# StatefulSet, so the script applies the CR's pod template to the live
# workloads before the c-02 drain.
patchesWait:
  - kind: StatefulSet
    namespace: mysql
    name: mysql-0
  - kind: Deployment
    namespace: mysql
    name: mysql-0-router

shutdown:
  drain: true
  # false = PDB-aware drain. Set true or pass --force-drain to add
  # --disable-eviction (bypasses PDBs; use only if a drain is stuck).
  drainForce: false
  drbdDown: true
  talosShutdown: true
  waitTimeoutSeconds: 900
  customResourceWaitSeconds: 180
  postShutdownWaitSeconds: 180
  scaledPodWaitSeconds: 120

restore:
  # Wait for the restored workloads to start before looking for Pending pods.
  waitForRunningSeconds: 60
  rebalance:
    enabled: true
    maxMoves: 2
    waitSeconds: 300
    # Movable workloads that may be evicted from a full node to make room for
    # Pending pods that are pinned there (for example the rpi-00 monitoring
    # DaemonSet pods). Keep this to non-critical Deployments/StatefulSets.
    candidates:
      - phela/Deployment/phela
