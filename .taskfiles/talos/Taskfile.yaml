# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
tasks:
  render:
    desc: Render Talos configuration
    dir: "{{.TALOS_DIR}}"
    cmds:
      - mkdir -p {{.TALOS_RENDER_DIR}}
      - topf render -o {{.TALOS_RENDER_DIR}}
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf
  apply:
    desc: Apply Talos config to all nodes
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf
  apply-node:
    desc: Apply Talos config to a node [HOST=required]
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --nodes-filter '^{{.HOST}}$' --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [HOST]
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf
  apply-dry-run:
    desc: Show pending Talos config changes without applying them
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --dry-run || [ $? -eq 2 ]
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf
  nodes:
    desc: List nodes and their current state
    dir: "{{.TALOS_DIR}}"
    cmd: topf nodes
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf
  clusterinfo:
    desc: Show non-sensitive cluster information
    dir: "{{.TALOS_DIR}}"
    cmd: topf clusterinfo
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf
  upgrade-node:
    desc: Upgrade Talos on a single node [HOST=required]
    dir: "{{.TALOS_DIR}}"
    cmd: topf upgrade --nodes-filter '^{{.HOST}}$'
    requires:
      vars: [HOST]
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf
  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: "{{.TALOS_DIR}}"
    cmd: talosctl upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TOPFCONFIG}}
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq
  kubeconfig:
    desc: Generate an admin kubeconfig and write it to the secrets dir
    dir: "{{.TALOS_DIR}}"
    cmds:
      - mkdir -p {{.SECRETS_DIR}}
      - topf kubeconfig > {{.KUBECONFIG}}
      - chmod 600 {{.KUBECONFIG}}
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf
  talosconfig:
    desc: Generate a Talos client configuration from the secrets bundle
    dir: "{{.TALOS_DIR}}"
    cmds:
      - mkdir -p {{.SECRETS_DIR}}/talos
      - topf talosconfig > {{.TALOSCONFIG}}
    preconditions:
      - test -f {{.TOPFCONFIG}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf
  reset:
    desc: Resets nodes back to maintenance mode
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --full={{.FULL}}
    vars:
      FULL: '{{ if eq .CLI_FORCE true }}true{{ else }}false{{ end }}'
    preconditions:
      - which topf
