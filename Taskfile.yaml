# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: "{{.ROOT_DIR}}/bootstrap"
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  SECRETS_DIR: "{{.ROOT_DIR}}/../home-ops-secrets"
  KUBECONFIG: "{{.SECRETS_DIR}}/kubeconfig"
  SOPS_AGE_KEY_FILE: "{{.SECRETS_DIR}}/age.key"
  SCRIPTS_DIR: "{{.ROOT_DIR}}/scripts"
  TALOS_DIR: "{{.ROOT_DIR}}/talos"
  TALOS_RENDER_DIR: "{{.SECRETS_DIR}}/talos/rendered"
  TOPFCONFIG: "{{.ROOT_DIR}}/talos/topf.yaml"
  TALOSCONFIG: "{{.SECRETS_DIR}}/talos/talosconfig"

env:
  KUBECONFIG: "{{.SECRETS_DIR}}/kubeconfig"
  SOPS_AGE_KEY_FILE: "{{.SECRETS_DIR}}/age.key"
  TALOSCONFIG: "{{.TALOSCONFIG}}"
  TOPFCONFIG: "{{.TOPFCONFIG}}"

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos

tasks:
  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  c02:shutdown:
    desc: Plan the c-02 shutdown/scale-down (dry run, no changes)
    cmd: ./scripts/c02-shutdown.sh --config scripts/c02-shutdown.yaml
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.TALOSCONFIG}}
      - which kubectl jq yq talosctl

  c02:shutdown:apply:
    desc: Scale down, drain, drbdadm down and shut down c-02
    cmd: ./scripts/c02-shutdown.sh --config scripts/c02-shutdown.yaml --apply
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.TALOSCONFIG}}
      - which kubectl jq yq talosctl

  c02:restore:
    desc: Restore Flux/apps after c-02 is powered back on
    cmd: ./scripts/c02-shutdown.sh --config scripts/c02-shutdown.yaml --restore
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl jq yq
